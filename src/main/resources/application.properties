spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.application.name=simple-spend
#spring.datasource.url=${DB_PATH}
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Crucial configuration for escaping reserved column words like "limit"
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# Limit active connections to fit within Clever Cloud's free tier (Max 5)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
